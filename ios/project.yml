name: Rajya
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: B5U69WW3Q3
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    VERSIONING_SYSTEM: apple-generic
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  Rajya:
    type: application
    platform: iOS
    sources:
      - path: Rajya
        excludes: [Resources, Info.plist, PrivacyInfo.xcprivacy]
      - path: Rajya/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Rajya/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lk.keducation.rajya
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Rajya/Info.plist
      properties:
        CFBundleDisplayName: Rajya
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false
        RajyaAPIBaseURL: https://exam.keducation.site/
        UIAppFonts: [NotoSansSinhala.ttf, NotoSansTamil.ttf]
  RajyaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Rajya
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lk.keducation.rajya.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Rajya:
    build:
      targets:
        Rajya: all
    test:
      targets: [RajyaTests]
